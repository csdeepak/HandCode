[project]
# The distribution is `handcode` (`agentctl` is taken on PyPI, docs/0047 §5);
# the import package and the command stay `agentctl`. `handcode` is installed
# as a second name for the same command, so `uv tool install handcode` gives a
# command named after what was installed.
name = "handcode"
version = "0.3.0"
description = "A coding agent whose work survives crashes, restarts and provider switches"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "csdeepak" }]
keywords = ["agent", "coding-agent", "openhands", "litellm", "llm",
            "crash-recovery", "idempotency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/csdeepak/HandCode"
Documentation = "https://github.com/csdeepak/HandCode/tree/main/guide"
Changelog = "https://github.com/csdeepak/HandCode/blob/main/CHANGELOG.md"
Issues = "https://github.com/csdeepak/HandCode/issues"

[project.scripts]
agentctl = "agentctl.cli:main"
handcode = "agentctl.cli:main"

[project.optional-dependencies]
openhands = ["openhands-sdk>=1.45.0"]
# litellm[proxy] declares `mcp<2.0`, while the OpenHands SDK needs fastmcp and
# therefore `mcp>=2`. The two are genuinely incompatible ON PAPER.
#
# Declaring `mcp>=2.2.0` here -- the fix docs/0021 §7 thought it had made --
# does not resolve that. It makes the extra UNINSTALLABLE: pip reports
# ResolutionImpossible and refuses, which is correct behaviour on its part.
# The local environment only had both because they were installed at different
# times and pip never re-resolved. CI installing from scratch is what exposed
# it (docs/0028).
#
# They work together in practice, so the override is deliberate and explicit:
#
#     pip install -e ".[dev,openhands,proxy]"
#     pip install --upgrade "mcp>=2.2.0" "fastmcp>=4.0.3"
#
# `fastmcp` is named because the proxy install leaves only `fastmcp-slim`,
# which has no client support, and the SDK does `from fastmcp import Client`.
#
# `verify.py` is what certifies the combination, and CI asserts the mcp major
# version directly rather than trusting either package's metadata.
proxy = ["litellm[proxy]>=1.100.0"]
dev = ["pytest>=8.0", "markdown-it-py>=3"]    # markdown-it: website/build.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentctl*"]

[tool.setuptools.package-data]
"agentctl.kernel.ledger" = ["*.sql"]
"agentctl.control.matrix.data" = ["*.yaml"]
# Without this a non-editable install ships no default policy at all.
"agentctl.control.policy.data" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
