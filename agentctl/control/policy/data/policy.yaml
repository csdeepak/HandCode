# The default policy: what `docs/0013` calls the real daily driver.
#
# Edit this, run `agentctl policy compile`, and the kernel picks up the
# compiled artifact. Nothing here is evaluated in-band -- see
# `agentctl/kernel/policy.py`.
version: 1

# Pool members are the model strings `agentctl run` actually sends through the
# proxy: `--model openai/pool`, or `--source <name>` -> `openai/pool-<name>`.
# They used to name `openrouter/free` and friends, which no run ever sends, so
# every `--policy` run stopped at "spend on it?" (docs/0042 I-16).
pools:
  free_tier:
    - openai/pool
    - openai/pool-openrouter
    - openai/pool-gemini
    - openai/pool-mistral
    - openai/pool-cerebras
    - openai/pool-groq
  paid:
    - openai/paid

# No automatic triggers: `when: {or_after_failures, requires_capability}` used
# to sit here, compiled and read by nothing. Escalation is only ever a model
# you name, confirmed before the first token.
routing:
  default_pool: free_tier
  escalate_to:
    pool: paid
    # docs/0002 section 5: never silently spend.
    require_confirmation: true

budget:
  daily_usd: 2.00
  per_task_usd: 0.50
  on_exceeded: block
  # litellm reports 0.0 for endpoints it cannot price (docs/0021 section 5), so
  # measured spend is a LOWER bound. `warn` keeps working and says so, which is
  # fail-open -- consistent with docs/0008 section 6.5, where cost decisions
  # fail open and only effect decisions fail closed. `block` is the honest
  # alternative and stops most free-tier work.
  on_unpriced: warn

effects:
  destructive: require_human_approval
  external:    reconcile_or_block
