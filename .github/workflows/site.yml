name: site

# docs/0054. Builds the documentation site from guide/ (website/build.py),
# fails on a broken link, and deploys it to GitHub Pages -- but only once the
# owner has switched Pages on (Settings > Pages > Source: GitHub Actions).
# Until then the deploy is skipped, with a notice, and nothing is published.
# The check runs in a job of its own, so a skipped deploy never creates the
# `github-pages` environment.

on:
  push:
    branches: [main]
    paths: ["guide/**", README.md, CHANGELOG.md, "website/**", pyproject.toml,
            .github/workflows/site.yml]
  pull_request:
    paths: ["guide/**", README.md, CHANGELOG.md, "website/**",
            .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "markdown-it-py>=3"
      - name: Build, and check every link between pages
        run: python website/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages-on:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      on: ${{ steps.check.outputs.on }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)
          if [ "$type" = workflow ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docs site not deployed::GitHub Pages is not set to deploy from Actions (Settings > Pages > Source: GitHub Actions). The site was built and checked; nothing was published."
          fi

  deploy:
    needs: pages-on
    if: needs.pages-on.outputs.on == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
