name: Bug report
description: Something agentctl did that it should not have, or did not do.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. A security problem (a key exposed, an effect run twice, a way
        around a confirmation) should go to **Security -> Report a
        vulnerability** instead, privately. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran, and its output
      description: The end-of-run report is the most useful part. Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: agentctl --version
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: agentctl doctor --offline
      description: It never prints a key's value, only whether one is set.
      render: text
  - type: dropdown
    id: demo
    attributes:
      label: Does `agentctl demo` pass on this machine?
      options:
        - "Yes"
        - "No (output pasted above)"
        - "Did not try"
